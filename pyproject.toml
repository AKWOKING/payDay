[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "payday-backend"
version = "1.0.0"
description = "PayDay — Integrated e-Wallet for Cameroon (MTN MoMo, Orange Money & UBA)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.1",
    "pydantic[email]>=2.6.4",
    "email-validator>=2.1.1",
    "pydantic-settings>=2.2.1",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.1.2",
    "cryptography>=42.0.5",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "redis>=5.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "fakeredis>=2.20.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole session, rather than a fresh loop per test.
#
# The test engine is a module-global SQLite StaticPool: exactly one DBAPI
# connection, shared by every test. aiosqlite binds that connection's internal
# lock to the loop that first uses it, so a per-test loop makes any *concurrent*
# test fail with "Lock object is bound to a different event loop" purely because
# of test ordering. That was a real flake (load-capacity burst tests failed
# depending on which test ran first) and it made the suite's result depend on
# order. One long-lived loop also matches production, where the app runs in a
# single loop for the life of the process.
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
python_files = "test_*.py"
