# =============================================================================
# PayDay e-Wallet — local / pilot compose stack
#
# Services:
#   db        PostgreSQL 15, the production-target datastore.
#   redis     Redis 7 — shared counter store (login throttle + PIN lockout).
#             The API refuses to start without it (fail-closed), so the api
#             service waits for the healthcheck before starting.
#   migrate   One-shot Alembic `upgrade head`, gated on db health.
#   api       FastAPI application, gated on migrations + redis health.
#
# Celery remains aspirational: `services/task_queue.py` is still in-process.
# =============================================================================

services:
  db:
    image: postgres:15-alpine
    container_name: payday-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-payday_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payday_password}
      POSTGRES_DB: ${POSTGRES_DB:-payday_db}
    volumes:
      - payday_pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      # `pg_isready` alone returns true before the init scripts finish, so we
      # scope the check to the actual application database.
      test:
        ["CMD-SHELL",
         "pg_isready -U ${POSTGRES_USER:-payday_user} -d ${POSTGRES_DB:-payday_db}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: payday-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  migrate:
    build:
      context: .
      target: runtime
    image: payday-backend:local
    container_name: payday-migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-payday_user}:${POSTGRES_PASSWORD:-payday_password}@db:5432/${POSTGRES_DB:-payday_db}
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    build:
      context: .
      target: runtime
    image: payday-backend:local
    container_name: payday-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-False}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-payday_user}:${POSTGRES_PASSWORD:-payday_password}@db:5432/${POSTGRES_DB:-payday_db}
      # Shared counter store (Redis 7) — fail-closed: api waits on the
      # healthcheck and the app refuses to start if Redis is unreachable.
      COUNTER_BACKEND: ${COUNTER_BACKEND:-redis}
      REDIS_URL: redis://redis:6379/0
      REDIS_REQUIRED: "true"
      # Override both of these in any non-local environment.
      SECRET_KEY: ${SECRET_KEY:-payday-super-secret-development-key-change-in-production-min32chars}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-payday_aes256_secret_key_32bytes!}
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        ["CMD-SHELL",
         "curl --fail --silent http://localhost:8000/api/v1/public/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  payday_pgdata:
    driver: local
